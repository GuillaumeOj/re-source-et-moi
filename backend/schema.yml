      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /manage/pricing-types/reorder/:
    post:
      operationId: manage_pricing_types_reorder_create
      description: |-
        Set the order of every group at once, from the full list of ids.

        One request, and one UPDATE statement, rather than a PATCH per group from the
        browser: a reorder is all-or-nothing, never half-renumbered. The list must name
        every group exactly once, so a stale screen (a group added or deleted elsewhere)
        is refused instead of leaving two groups on the same position.
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingTypeOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricingTypeOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricingTypeOrderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /manage/reviews/:
    get:
      operationId: manage_reviews_list
      description: |-
        Every review, hidden ones included, editable by staff. Backs the editor's
        "Témoignages" tab.
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
