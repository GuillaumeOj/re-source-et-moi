openapi: 3.0.3
info:
  title: Re-Source Et Moi API
  version: 1.0.0
  description: Agenda & tarifs — read-only REST API consumed by the Next.js site.
paths:
  /auth/account/:
    put:
      operationId: auth_account_update
      description: Change the logged-in staff member's username and e-mail.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        Set the CSRF cookie, and nothing else.

        Every write needs the token, and a logged-out page (login, reset) has nothing else to
        get it from. The editor's fetch layer calls this by itself before its first write, so
        no page has to know about it.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /auth/password/:
    post:
      operationId: auth_password_create
      description: |-
        Change the logged-in staff member's password, keeping the session open.

        Django invalidates every session when the password changes. update_session_auth_hash
        re-validates this one, so she isn't logged out of the page she changed it from, while
        any other browser still logged in as her is.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Send a reset link to a staff member's e-mail address.

        Always 204, whether or not the address matches an account, so the form cannot be used
        to find out which addresses do. For the same reason a Brevo failure is logged rather
        than reported: only a matching address ever reaches the send, so an error would reveal
        the match.

        The link points at settings.EDITOR_URL and never at anything taken from the request.
        See the note on EDITOR_URL in settings.py.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        Set a new password from the link in the reset e-mail.

        The token is Django's: single-use (it is tied to the current password hash), and
        valid for PASSWORD_RESET_TIMEOUT. Setting the password ends every open session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /auth/password-rules/:
    get:
      operationId: auth_password_rules_retrieve
      description: |-
        The password rules, in French, straight from AUTH_PASSWORD_VALIDATORS.

        The editor shows these under every "new password" field. They come from the backend
        so the hint can never promise less, or more, than what is actually enforced.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRules'
          description: ''
  /auth/session/:
    get:
      operationId: auth_session_retrieve
      description: |-
        Who is logged in: 401 without a session, 403 for a non-staff one. The editor uses
        this to decide between its login form and the editor itself.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /events/:
    get:
      operationId: events_list
      description: |-
        The published workshops, soonest first: the upcoming ones, or those in a date range.

        Without parameters this is the upcoming agenda, which the home page and the agenda's
        list view show. With `date_from`/`date_to` it is every published workshop in the range,
        past ones included, for the agenda's month calendar. Past workshops are no secret —
        they were on the site until their date — so opening the range up exposes nothing new.

        Public: this is the same content the website already shows to anyone, so requiring a
        token would only complicate the caller. DRF's project default is IsAuthenticated, so
        the AllowAny here is a deliberate, visible exception rather than a missing setting.

        Pagination is off. The list is a handful of rows, and an unpaginated response makes
        the generated TypeScript type a plain array instead of {count, next, previous,
        results} — the frontend maps over it directly.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      tags:
      - events
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
  /health/:
    get:
      operationId: health_retrieve
      description: Liveness probe used by the dev stack's healthcheck. Public — no
        auth required.
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: ''
  /manage/addresses/:
    get:
      operationId: manage_addresses_list
      description: |-
        The saved addresses workshops point at, editable by staff.

        Unpaginated: it is a short list of places, which the event form loads whole into its
        picker. A delete is refused while a workshop still uses the address — the foreign key
        is PROTECT — with a message saying so, rather than the 500 the ProtectedError would be.
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressManage'
          description: ''
    post:
      operationId: manage_addresses_create
      description: |-
        The saved addresses workshops point at, editable by staff.

        Unpaginated: it is a short list of places, which the event form loads whole into its
        picker. A delete is refused while a workshop still uses the address — the foreign key
        is PROTECT — with a message saying so, rather than the 500 the ProtectedError would be.
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressManageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressManageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressManageRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressManage'
          description: ''
  /manage/addresses/{id}/:
