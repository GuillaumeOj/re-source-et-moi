  /manage/pricing-types/:
    get:
      operationId: manage_pricing_types_list
      description: |-
        Every tariff group with every line (hidden ones included), editable by staff.

        This backs the site owner's editor. Lines are written through their group (see
        PricingTypeManageSerializer), so there is no separate prices endpoint to keep
        consistent with this one.
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PricingTypeManage'
          description: ''
    post:
      operationId: manage_pricing_types_create
      description: |-
