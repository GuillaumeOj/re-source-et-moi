components:
  schemas:
    AccountRequest:
      type: object
      description: |-
        The editor's "Mon compte" form: new username and e-mail, confirmed by the current
        password. The e-mail is where a reset link goes, so changing it is as sensitive as
        changing the password, and it is required: an account without one cannot be recovered.
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: Adresse électronique
          maxLength: 254
        current_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - email
      - username
    AddressManage:
      type: object
      description: |-
        A saved address as the editor's "Adresses" tab reads and writes it.

        `event_count` is how many workshops use it, so the editor can say why one cannot be
        deleted before she tries. It comes from the viewset's annotation; a freshly created
        address has none, and uses nothing. `one_line` is the address as the site prints it, so
        the editor shows the same thing without formatting it a second time.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nom
          description: Pour la retrouver dans la liste, par exemple « Salle Paul Éluard
            ».
          maxLength: 120
        line1:
          type: string
          title: Adresse
          maxLength: 200
        line2:
          type: string
          title: Complément d'adresse
          maxLength: 200
        postal_code:
          type: string
          title: Code postal
          maxLength: 16
        city:
          type: string
          title: Ville
          maxLength: 120
        one_line:
          type: string
          readOnly: true
        event_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - line1
      - line2
      - postal_code
      - city
      - one_line
      - event_count
    AddressManageRequest:
      type: object
      description: |-
        A saved address as the editor's "Adresses" tab reads and writes it.

        `event_count` is how many workshops use it, so the editor can say why one cannot be
        deleted before she tries. It comes from the viewset's annotation; a freshly created
        address has none, and uses nothing. `one_line` is the address as the site prints it, so
        the editor shows the same thing without formatting it a second time.
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          description: Pour la retrouver dans la liste, par exemple « Salle Paul Éluard
            ».
          maxLength: 120
        line1:
          type: string
          title: Adresse
          maxLength: 200
        line2:
          type: string
          title: Complément d'adresse
          maxLength: 200
        postal_code:
          type: string
          title: Code postal
          maxLength: 16
        city:
          type: string
          minLength: 1
          title: Ville
          maxLength: 120
      required:
      - city
      - name
    Event:
      type: object
      description: |-
        A workshop as the public agenda needs it.

        Values go out machine-readable — an ISO date, ISO times, a location kind — and the
        frontend renders them with Intl.DateTimeFormat("fr-FR"). Formatting here instead would
        put French display strings in the database's contract and make the data unsortable
        again, which is the exact problem this replaced.

        The postal address is flattened into a single `address` string: the site shows one
        line, and the saved Address keeps its parts apart so the forms can guide input, not
        because anything downstream wants them apart.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Titre
          maxLength: 200
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          title: Heure de début
        end_time:
          type: string
          format: time
          title: Heure de fin
        location_kind:
          allOf:
          - $ref: '#/components/schemas/LocationKindEnum'
          title: Type de lieu
        location_label:
          type: string
          readOnly: true
        online_url:
          type: string
          format: uri
          title: Lien de visioconférence
          maxLength: 200
        address:
          type: string
          description: The postal address on one line, or "" for an online workshop.
          readOnly: true
        description:
          type: string
      required:
      - id
      - title
      - date
      - start_time
      - end_time
      - location_kind
      - location_label
      - online_url
      - address
      - description
    EventManage:
      type: object
      description: |-
        A workshop as the site owner's editor reads and writes it.

        Not the public shape. It carries the chosen Address's id and the label override (what
        the form edits) and `is_published`. The derived `location_label` is read-only,
        so the list can show what the site will display. Validation reuses `Event.clean()`
        through ModelCleanMixin, so the editor gets the admin's French field messages.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Titre
          maxLength: 200
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          title: Heure de début
        end_time:
          type: string
          format: time
          title: Heure de fin
        location_kind:
          allOf:
          - $ref: '#/components/schemas/LocationKindEnum'
          title: Type de lieu
        location_label_override:
          type: string
          title: Libellé du lieu
          description: Laisser vide pour le déduire du lieu (« En ligne », ou la ville
            de l'adresse).
          maxLength: 120
        location_label:
          type: string
          readOnly: true
        online_url:
          type: string
          format: uri
          title: Lien de visioconférence
          maxLength: 200
        address:
          type: string
          format: uuid
          nullable: true
          title: Adresse
        description:
          type: string
        is_published:
          type: boolean
          title: Publié
          description: Décocher pour préparer un atelier sans l'afficher sur le site.
      required:
      - id
      - title
      - date
      - start_time
      - end_time
      - location_kind
      - location_label_override
      - location_label
      - online_url
      - address
      - description
      - is_published
    EventManageRequest:
      type: object
      description: |-
        A workshop as the site owner's editor reads and writes it.

        Not the public shape. It carries the chosen Address's id and the label override (what
        the form edits) and `is_published`. The derived `location_label` is read-only,
        so the list can show what the site will display. Validation reuses `Event.clean()`
