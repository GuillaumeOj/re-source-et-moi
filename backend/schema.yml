      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) adresse.
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressManage'
          description: ''
    put:
      operationId: manage_addresses_update
      description: |-
        The saved addresses workshops point at, editable by staff.

        Unpaginated: it is a short list of places, which the event form loads whole into its
