      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /manage/events/:
    get:
      operationId: manage_events_list
      description: |-
        Every workshop (drafts and past ones included), editable by staff.

        This backs the site owner's editor. Unlike the public list it hides nothing: a draft is
        exactly what she is working on, and a past workshop is what she duplicates to plan the
        next one. The list is paginated, because unlike the public feed it only ever grows.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          enum:
          - upcoming
          - past
          type: string
          minLength: 1
        description: |-
          upcoming: from today on, soonest first. past: before today, latest first.

          * `upcoming` - À venir
          * `past` - Passés
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventManageList'
          description: ''
    post:
      operationId: manage_events_create
      description: |-
        Every workshop (drafts and past ones included), editable by staff.

        This backs the site owner's editor. Unlike the public list it hides nothing: a draft is
        exactly what she is working on, and a past workshop is what she duplicates to plan the
        next one. The list is paginated, because unlike the public feed it only ever grows.
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventManageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventManageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventManageRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventManage'
          description: ''
