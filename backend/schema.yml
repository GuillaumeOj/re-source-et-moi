      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingTypeManageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricingTypeManageRequest'
          multipart/form-data:
            schema:
