          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressManageRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressManage'
          description: ''
    patch:
      operationId: manage_addresses_partial_update
      description: |-
        The saved addresses workshops point at, editable by staff.

