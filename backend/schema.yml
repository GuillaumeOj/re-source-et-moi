    PatchedPricingTypeManageRequest:
      type: object
      description: |-
        A tariff group with its lines, saved in one request.

        This mirrors the admin's inline: the site owner edits "Individuel" and all its lines
        on one screen, and one "Enregistrer" writes the lot. When `prices` is sent, it is the
        group's complete list. Lines with an `id` are updated, lines without one are created,
        and any existing line left out is deleted, all in one transaction. So a bad line
        leaves the whole group as it was.
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 100
        description:
          type: string
          description: Note affichée sous les tarifs de ce groupe.
        position:
          type: integer
          maximum: 32767
          minimum: 0
          description: 'Ordre d''affichage : le plus petit nombre en premier.'
        is_published:
          type: boolean
          title: Publié
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PriceManageRequest'
    PatchedReviewManageRequest:
      type: object
      description: |-
        A review as the editor reads and writes it, drafts included.

        `created_at` is sent back read-only: it is what decides which reviews reach the home
        page, so the editor can show it.
      properties:
        text:
          type: string
          minLength: 1
          title: Avis
        author:
          type: string
          minLength: 1
          title: Nom
          maxLength: 100
        context:
          type: string
          title: Description
          description: Par ex. « Atelier découverte », « Parent d'élève ».
          maxLength: 100
        is_published:
          type: boolean
          title: Publié
          description: Décocher pour garder l'avis sans l'afficher sur le site.
    Price:
      type: object
      description: |-
        One tariff line.

        `amount` goes out as a decimal string (DRF's default, which avoids float rounding) or
        null when the tariff is on demand. The frontend formats it with Intl.NumberFormat —
        the euro sign never enters the data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        description:
          type: string
          title: Libellé
          maxLength: 200
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          title: Montant
          description: En euros. Laisser vide si le tarif est sur devis.
        on_demand:
          type: boolean
          title: Sur devis
          description: Cocher pour afficher « Sur devis » à la place d'un montant.
      required:
      - id
      - description
      - amount
      - on_demand
    PriceManage:
      type: object
